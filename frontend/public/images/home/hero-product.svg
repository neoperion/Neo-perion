<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="750" fill="#FFFFFF"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="206" height="750" fill="#FCFCFD"/>
  <line x1="206" y1="0" x2="206" y2="750" stroke="#E4E4E7" stroke-width="1.5"/>
  <rect x="26" y="28" width="20" height="20" rx="6" fill="#1E5DFF"/>
  <text x="56" y="44" fill="#0A0A0B" font-size="15" font-weight="700">AINCURU</text>
  <rect x="18" y="98" width="170" height="40" rx="9" fill="#F2F6FF"/>
  <circle cx="40" cy="118" r="4" fill="#1E5DFF"/><text x="56" y="123" fill="#1E5DFF" font-size="13.5" font-weight="600">Overview</text>
  <circle cx="40" cy="168" r="4" fill="#A1A1AA"/><text x="56" y="173" fill="#71717A" font-size="13.5" font-weight="500">Analytics</text>
  <circle cx="40" cy="214" r="4" fill="#A1A1AA"/><text x="56" y="219" fill="#71717A" font-size="13.5" font-weight="500">Customers</text>
  <circle cx="40" cy="260" r="4" fill="#A1A1AA"/><text x="56" y="265" fill="#71717A" font-size="13.5" font-weight="500">AI Copilot</text>
  <circle cx="40" cy="306" r="4" fill="#A1A1AA"/><text x="56" y="311" fill="#71717A" font-size="13.5" font-weight="500">Settings</text>

  <!-- top bar -->
  <line x1="206" y1="72" x2="1200" y2="72" stroke="#E4E4E7" stroke-width="1.5"/>
