  <rect x="918" y="18" width="148" height="36" rx="18" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.4"/>
  <circle cx="942" cy="36" r="4" fill="#A1A1AA"/><text x="956" y="41" fill="#3F3F46" font-size="12.5" font-weight="500">Last 30 days</text>
  <circle cx="1158" cy="36" r="17" fill="#1E5DFF"/><text x="1158" y="41" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">NP</text>

  <!-- stat cards -->
  <g>
    <rect x="238" y="100" width="279" height="88" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="262" y="132" fill="#71717A" font-size="12.5" font-weight="600">Revenue</text>
    <text x="262" y="166" fill="#0A0A0B" font-size="24" font-weight="700">$48.2k</text>
    <text x="493" y="132" text-anchor="end" fill="#1E5DFF" font-size="13" font-weight="700">+12%</text>
  </g>
  <g>
    <rect x="533" y="100" width="279" height="88" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="557" y="132" fill="#71717A" font-size="12.5" font-weight="600">Active users</text>
    <text x="557" y="166" fill="#0A0A0B" font-size="24" font-weight="700">8,420</text>
    <text x="788" y="132" text-anchor="end" fill="#1E5DFF" font-size="13" font-weight="700">+4%</text>
  </g>

  <!-- chart card -->
  <g>
    <rect x="238" y="206" width="574" height="376" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="262" y="242" fill="#0A0A0B" font-size="15" font-weight="700">Revenue</text>
    <text x="262" y="263" fill="#71717A" font-size="12">last 30 days</text>
    <line x1="262" y1="330" x2="788" y2="330" stroke="#F0F2F6" stroke-width="1.4"/>
    <line x1="262" y1="408" x2="788" y2="408" stroke="#F0F2F6" stroke-width="1.4"/>
    <line x1="262" y1="486" x2="788" y2="486" stroke="#F0F2F6" stroke-width="1.4"/>
    <path d="M262,478 L320,448 L378,460 L436,402 L494,420 L552,356 L610,372 L668,318 L726,336 L788,296 L788,540 L262,540 Z" fill="#1E5DFF" fill-opacity="0.07"/>
    <path d="M262,478 L320,448 L378,460 L436,402 L494,420 L552,356 L610,372 L668,318 L726,336 L788,296" fill="none" stroke="#1E5DFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="788" cy="296" r="5" fill="#1E5DFF" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>

  <!-- AI insights panel -->
  <g>
    <rect x="828" y="100" width="340" height="482" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <circle cx="858" cy="134" r="4" fill="#1E5DFF"/>
    <text x="872" y="139" fill="#0A0A0B" font-size="15" font-weight="700">AI insights</text>

    <rect x="852" y="160" width="292" height="96" rx="10" fill="#F4F8FF" stroke="#1E5DFF" stroke-opacity="0.2" stroke-width="1.4"/>
    <text x="872" y="192" fill="#0A0A0B" font-size="13.5" font-weight="700">Churn risk rising in SMB</text>
    <text x="872" y="214" fill="#3F3F46" font-size="12.5">Activation drops at onboarding</text>
    <text x="872" y="232" fill="#3F3F46" font-size="12.5">step 3 — 18% never complete it.</text>

    <text x="852" y="296" fill="#A1A1AA" font-size="11.5" font-weight="700" letter-spacing="1">RECOMMENDED</text>
    <g>
      <circle cx="862" cy="326" r="9" fill="#ECFDF3"/><path d="M858,326 l3,3 l5,-6" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="882" y="324" fill="#0A0A0B" font-size="13" font-weight="600">Add guided onboarding</text>
      <text x="882" y="342" fill="#71717A" font-size="11.5">est. +6% activation</text>
    </g>
    <g>
      <circle cx="862" cy="384" r="9" fill="#ECFDF3"/><path d="M858,384 l3,3 l5,-6" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="882" y="382" fill="#0A0A0B" font-size="13" font-weight="600">Trigger re-engage email</text>
      <text x="882" y="400" fill="#71717A" font-size="11.5">day 2 after signup</text>
    </g>
    <g>
      <circle cx="862" cy="442" r="9" fill="#ECFDF3"/><path d="M858,442 l3,3 l5,-6" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="882" y="440" fill="#0A0A0B" font-size="13" font-weight="600">Flag accounts to CSM</text>
      <text x="882" y="458" fill="#71717A" font-size="11.5">14 at-risk this week</text>
    </g>

    <rect x="852" y="498" width="292" height="46" rx="10" fill="#1E5DFF"/>
    <text x="998" y="526" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="600">Apply recommendations</text>
  </g>
