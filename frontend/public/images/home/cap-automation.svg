<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="Inter, system-ui, sans-serif">
  <defs>
    <pattern id="dots-au" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#E9EDF3"/>
    </pattern>
    <marker id="ah-au" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L8,5 L2,8" fill="none" stroke="#C5CCD8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-au-b" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L8,5 L2,8" fill="none" stroke="#1E5DFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="#FFFFFF"/>
  <rect width="1200" height="750" fill="url(#dots-au)"/>
  <text x="66" y="74" fill="#71717A" font-size="17" font-weight="700" letter-spacing="2.5">WORKFLOW AUTOMATION</text>

  <!-- trigger -->
  <g>
    <rect x="66" y="328" width="190" height="92" rx="12" fill="#F2F6FF" stroke="#1E5DFF" stroke-width="1.6"/>
    <circle cx="92" cy="356" r="4" fill="#1E5DFF"/>
    <text x="161" y="370" text-anchor="middle" fill="#0A0A0B" font-size="16" font-weight="700">Trigger</text>
    <text x="161" y="392" text-anchor="middle" fill="#71717A" font-size="12.5">New lead created</text>
  </g>
  <line x1="256" y1="374" x2="326" y2="374" stroke="#D7DCE5" stroke-width="2" marker-end="url(#ah-au)"/>

  <!-- validate -->
  <g>
    <rect x="328" y="328" width="190" height="92" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <circle cx="354" cy="356" r="4" fill="#A1A1AA"/>
    <text x="423" y="370" text-anchor="middle" fill="#0A0A0B" font-size="16" font-weight="600">Validate &amp; enrich</text>
    <text x="423" y="392" text-anchor="middle" fill="#71717A" font-size="12.5">dedupe, score</text>
  </g>
  <line x1="518" y1="374" x2="582" y2="374" stroke="#D7DCE5" stroke-width="2" marker-end="url(#ah-au)"/>

  <!-- decision diamond -->
  <g>
    <path d="M660,318 L728,374 L660,430 L592,374 Z" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="660" y="379" text-anchor="middle" fill="#0A0A0B" font-size="14" font-weight="600">Qualified?</text>
  </g>

  <!-- branch yes (up) -->
  <path d="M728,360 H820 V250 H892" fill="none" stroke="#1E5DFF" stroke-width="2" marker-end="url(#ah-au-b)"/>
  <text x="800" y="300" fill="#1E5DFF" font-size="12.5" font-weight="700">yes</text>
  <g>
    <rect x="894" y="208" width="206" height="84" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <circle cx="920" cy="234" r="4" fill="#1E5DFF"/>
    <text x="997" y="248" text-anchor="middle" fill="#0A0A0B" font-size="16" font-weight="600">Route to sales</text>
    <text x="997" y="270" text-anchor="middle" fill="#71717A" font-size="12.5">assign + notify</text>
  </g>

  <!-- branch no (down) -->
  <path d="M728,388 H820 V498 H892" fill="none" stroke="#D7DCE5" stroke-width="2" marker-end="url(#ah-au)"/>
  <text x="802" y="452" fill="#71717A" font-size="12.5" font-weight="700">no</text>
  <g>
    <rect x="894" y="456" width="206" height="84" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <circle cx="920" cy="482" r="4" fill="#A1A1AA"/>
    <text x="997" y="496" text-anchor="middle" fill="#0A0A0B" font-size="16" font-weight="600">Nurture queue</text>
    <text x="997" y="518" text-anchor="middle" fill="#71717A" font-size="12.5">drip sequence</text>
  </g>

  <!-- update CRM -->
  <g>
    <rect x="120" y="556" width="206" height="84" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <circle cx="146" cy="582" r="4" fill="#A1A1AA"/>
    <text x="223" y="596" text-anchor="middle" fill="#0A0A0B" font-size="16" font-weight="600">Update CRM</text>
    <text x="223" y="618" text-anchor="middle" fill="#71717A" font-size="12.5">sync record</text>
  </g>
  <path d="M660,430 V598 H326" fill="none" stroke="#D7DCE5" stroke-width="2" stroke-dasharray="2 6" marker-end="url(#ah-au)"/>
</svg>
